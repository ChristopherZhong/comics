services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:alpine
    ports:
      - mode: bridge
        protocol: tcp
        published: "${POSTGRES_PORT}"
        target: "5432"
    volumes:
      - source: postgres_data
        target: /var/lib/postgresql/data
        type: volume

volumes:
  postgres_data:
