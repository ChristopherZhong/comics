services:
  postgres:
    image: postgres:15-alpine
    container_name: comics-postgres
    environment:
      POSTGRES_USER: comics_user
      POSTGRES_PASSWORD: comics_password
      POSTGRES_DB: comics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
